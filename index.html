<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123e35"><title>Mis Regalos · Navidad, Reyes y Cumpleaños</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17352e;background:#f5f6f2}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#123e35,#26725c);color:white;padding:25px 18px 32px;border-radius:0 0 28px 28px}main{max-width:900px;margin:auto;padding:0 15px 90px}h1{font-size:27px;margin:6px 0}h2{font-size:20px;margin:0 0 13px}p{margin:6px 0}.muted{color:#718079;font-size:13px}.intro{color:#d7e8de}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:-22px}.stat,.panel{background:white;border-radius:18px;padding:17px;box-shadow:0 3px 14px #17352e0c}.stat b{display:block;font-size:24px;margin-top:5px}.stat small{color:#718079}.panel{margin-top:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.tabs{display:flex;gap:7px;margin-top:18px;background:#e9eee9;padding:5px;border-radius:14px}.tabs button{flex:1;background:transparent;color:#496259}.tabs button.active{background:#fff;color:#14513e;box-shadow:0 1px 5px #0001}button{border:0;border-radius:11px;padding:11px 14px;background:#17644e;color:white;font-weight:700;cursor:pointer;font-size:14px}button.secondary{background:#edf3ef;color:#18533f}button.danger{background:#fff0ef;color:#b33b35}button:active{transform:scale(.98)}.empty{text-align:center;padding:35px 10px;color:#6a7e72}.empty span{font-size:42px;display:block;margin-bottom:12px}.kid,.gift{border:1px solid #e5ebe5;border-radius:14px;padding:13px;margin-top:10px}.kid .avatar{background:#eaf3e9;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:23px;flex-shrink:0}.grow{flex:1;min-width:0}.progress{height:8px;background:#e9eee9;border-radius:10px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:#299b6d}.progress.over>div{background:#d75a49}.tag{display:inline-block;padding:4px 8px;border-radius:8px;background:#eef3ee;font-size:12px;font-weight:600;color:#3f6858}.toy-photo{width:74px;height:74px;object-fit:cover;border-radius:13px;background:#f0f5ef;flex-shrink:0}.photo-preview{width:110px;height:110px;object-fit:cover;border-radius:14px;background:#edf3ef;margin-top:9px}.gift strong,.kid strong{overflow-wrap:anywhere}.gift .row{align-items:flex-start}.gift-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}select,input{width:100%;border:1px solid #dbe4dd;border-radius:11px;padding:12px;background:white;font:inherit;color:#18382d}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}.modal-bg{position:fixed;inset:0;background:#0c221b99;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal-bg.show{display:flex}.modal{background:white;width:min(100%,440px);border-radius:20px;padding:20px;max-height:92vh;overflow:auto}.modal h2{margin:0}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.season{background:#f6f8f5;padding:14px;border-radius:14px;margin-top:10px}.season b{font-size:21px}.filter{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}.filter button{white-space:nowrap}.mini{font-size:12px}.footer{text-align:center;color:#87958b;font-size:12px;margin-top:22px}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}header{text-align:center}.stat b{font-size:27px}}</style></head><body>
<header><div style="font-size:29px">🎄 🎁 👑</div><h1>Mis Regalos</h1><p class="intro">Navidad, Reyes y cumpleaños, todo organizado ✨</p></header><main><div class="stats" id="stats"></div><div class="tabs"><button class="active" data-tab="resumen">📊 Resumen</button><button data-tab="ninos">👧 Niños</button><button data-tab="regalos">🎁 Regalos</button></div><section id="view"></section><p class="footer">🔒 Tus datos se guardan en este navegador. No se comparten.</p></main>
<div class="modal-bg" id="overlay"><div class="modal"><div class="row"><h2 id="modalTitle"></h2><button class="secondary" onclick="closeModal()">✕</button></div><form id="form"></form></div></div>
<script>
const KEY='mis-regalos-navidad-reyes-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{kids:[],gifts:[]}}catch{db={kids:[],gifts:[]}};db.kids ||= [];db.gifts ||= [];let tab='resumen',filter='Todos';const euro=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()},sum=a=>a.reduce((t,g)=>t+Number(g.price||0),0),name=k=>db.kids.find(x=>x.id===k)?.name||'Sin asignar';

function toyImage(title){const t=String(title||'').toLowerCase();let symbol=/bici|bicicleta|patin/.test(t)?'🚲':/lego|bloque|constru/.test(t)?'🧱':/muñec|barbie|bebé/.test(t)?'🪆':/coche|carro|vehículo/.test(t)?'🚗':/pelota|fútbol|balón/.test(t)?'⚽':/libro|cuento/.test(t)?'📚':/videojuego|consola|playstation|nintendo/.test(t)?'🎮':/peluche|oso/.test(t)?'🧸':/puzzle|rompecabezas/.test(t)?'🧩':/patín|skate/.test(t)?'🛹':'🎁';const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><rect width="240" height="240" rx="28" fill="#e8f3eb"/><circle cx="195" cy="45" r="48" fill="#d1e8d8"/><circle cx="38" cy="202" r="56" fill="#d7e9df"/><text x="120" y="156" font-size="112" text-anchor="middle">${symbol}</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function render(){const total=sum(db.gifts),bought=db.gifts.filter(g=>g.status!=='Pendiente'),pending=db.gifts.filter(g=>g.status==='Pendiente');document.getElementById('stats').innerHTML=[["👧 Niños",db.kids.length],["🎁 Regalos",db.gifts.length],["💳 Comprado",euro(sum(bought))],["🛍️ Pendiente",euro(sum(pending))]].map(([a,b])=>`<div class="stat"><small>${a}</small><b>${b}</b></div>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const v=document.getElementById('view');if(tab==='resumen'){v.innerHTML=`<div class="panel"><h2>✨ Resumen general</h2><div class="split"><div class="season">🎄 Navidad<br><b>${euro(sum(db.gifts.filter(g=>g.when==='Navidad')))}</b><p class="muted">${db.gifts.filter(g=>g.when==='Navidad').length} regalos</p></div><div class="season">👑 Reyes Magos<br><b>${euro(sum(db.gifts.filter(g=>g.when==='Reyes')))}</b><p class="muted">${db.gifts.filter(g=>g.when==='Reyes').length} regalos</p></div><div class="season">🎂 Cumpleaños<br><b>${euro(sum(db.gifts.filter(g=>g.when==='Cumpleaños')))}</b><p class="muted">${db.gifts.filter(g=>g.when==='Cumpleaños').length} regalos</p></div></div><p style="margin-top:15px"><b>Valor total previsto: ${euro(total)}</b></p><p class="muted">Incluye regalos comprados y pendientes</p></div><div class="panel"><div class="row"><h2>Por niño</h2><button onclick="openKid()">+ Niño</button></div>${db.kids.length?db.kids.map(k=>kidHtml(k)).join(''):'<div class="empty"><span>🧸</span>Añade un niño para empezar a organizar sus regalos.<p><button onclick="openKid()">+ Añadir primer niño</button></p></div>'}</div><div class="panel"><div class="row"><h2>Regalos recientes</h2><button onclick="openGift()">+ Regalo</button></div>${db.gifts.length?db.gifts.slice(-4).reverse().map(g=>giftHtml(g)).join(''):'<div class="empty">Todavía no hay regalos añadidos.</div>'}</div>`}if(tab==='ninos')v.innerHTML=`<div class="panel"><div class="row"><h2>Mis niños (${db.kids.length})</h2><button onclick="openKid()">+ Añadir</button></div>${db.kids.length?db.kids.map(k=>kidHtml(k,true)).join(''):'<div class="empty"><span>👧</span>Añade a los niños y fija su presupuesto.</div>'}</div>`;if(tab==='regalos'){let gs=db.gifts.filter(g=>filter==='Todos'||g.when===filter||g.status===filter);v.innerHTML=`<div class="panel"><div class="row"><h2>Lista de regalos</h2><button onclick="openGift()">+ Añadir</button></div><div class="filter">${['Todos','Navidad','Reyes','Cumpleaños','Pendiente','Comprado','Envuelto'].map(f=>`<button class="${filter===f?'':'secondary'}" onclick="filter=${JSON.stringify(f)};render()">${f}</button>`).join('')}</div>${gs.length?gs.map(g=>giftHtml(g,true)).join(''):'<div class="empty"><span>🎁</span>No hay regalos en esta categoría.</div>'}</div>`}}
function kidHtml(k,edit=false){let gifts=db.gifts.filter(g=>g.kid===k.id),spent=sum(gifts),budget=Number(k.budget||0),pct=budget?Math.min(100,spent/budget*100):0;return `<div class="kid"><div class="row"><div class="avatar">${esc(k.emoji||'🧒')}</div><div class="grow"><strong>${esc(k.name)}</strong><div class="muted">${k.age!==''&&k.age!=null?esc(k.age)+' años · ':''}${gifts.length} regalos</div></div><strong>${euro(spent)}</strong></div>${budget?`<div class="progress ${spent>budget?'over':''}"><div style="width:${pct}%"></div></div><div class="row mini muted"><span>Presupuesto: ${euro(budget)}</span><span>${spent>budget?'Excedido '+euro(spent-budget):'Disponible '+euro(budget-spent)}</span></div>`:'<p class="muted">Sin presupuesto definido</p>'}<div class="gift-actions"><button class="secondary" onclick="openGift(null,'${k.id}')">+ Regalo</button>${edit?`<button class="secondary" onclick="openKid('${k.id}')">Editar</button><button class="danger" onclick="deleteKid('${k.id}')">Eliminar</button>`:''}</div></div>`}
function giftHtml(g,edit=false){return `<div class="gift"><div class="row"><img class="toy-photo" src="${esc(g.photo||toyImage(g.title))}" alt="Imagen del regalo"><div class="grow"><strong>${esc(g.title)}</strong><p class="muted">${esc(name(g.kid))} · ${g.when==='Navidad'?'🎄 Navidad':g.when==='Cumpleaños'?'🎂 Cumpleaños':'👑 Reyes'}${g.shop?' · '+esc(g.shop):''}</p><span class="tag">${g.status==='Pendiente'?'📝':g.status==='Comprado'?'🛍️':'🎀'} ${esc(g.status)}</span></div><strong>${euro(g.price)}</strong></div><div class="gift-actions">${g.status==='Pendiente'?`<button class="secondary" onclick="setStatus('${g.id}','Comprado')">✓ Comprado</button>`:g.status==='Comprado'?`<button class="secondary" onclick="setStatus('${g.id}','Envuelto')">🎀 Envuelto</button>`:''}<button class="secondary" onclick="openGift('${g.id}')">Editar</button>${edit?`<button class="danger" onclick="deleteGift('${g.id}')">Eliminar</button>`:''}</div></div>`}
function modal(title,html,submit){document.getElementById('modalTitle').textContent=title;let f=document.getElementById('form');f.innerHTML=html+'<div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button type="submit">Guardar ✓</button></div>';f.onsubmit=e=>{e.preventDefault();submit(new FormData(f));closeModal();save()};document.getElementById('overlay').classList.add('show');if(document.getElementById('toyUpload')){const upload=document.getElementById('toyUpload'),preview=document.getElementById('toyPreview'),titleInput=f.querySelector('[name=title]');titleInput.addEventListener('input',()=>{if(!window.pendingToyPhoto)preview.src=toyImage(titleInput.value)});upload.addEventListener('change',async()=>{let file=upload.files?.[0];if(!file)return;if(file.size>12000000){alert('Elige una imagen de menos de 12 MB');return}try{const bitmap=await createImageBitmap(file),canvas=document.createElement('canvas'),scale=Math.min(1,650/Math.max(bitmap.width,bitmap.height));canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);window.pendingToyPhoto=canvas.toDataURL('image/jpeg',.72);preview.src=window.pendingToyPhoto;bitmap.close()}catch(e){alert('No se ha podido leer la foto')}});document.getElementById('toyReset').onclick=()=>{window.pendingToyPhoto=null;preview.src=toyImage(titleInput.value);upload.value=''}}};function closeModal(){document.getElementById('overlay').classList.remove('show')}
function openKid(key){let k=db.kids.find(x=>x.id===key);modal(k?'Editar niño':'Añadir niño',`<label>Nombre *</label><input name="name" maxlength="60" required value="${esc(k?.name||'')}" placeholder="Ej. Lucía"><div class="split"><div><label>Edad</label><input name="age" type="number" min="0" max="99" value="${esc(k?.age??'')}" placeholder="Años"></div><div><label>Icono</label><select name="emoji">${['🧒','👧','👦','👶','💖','⭐'].map(e=>`<option ${e===(k?.emoji||'🧒')?'selected':''}>${e}</option>`).join('')}</select></div></div><label>Presupuesto total (€)</label><input name="budget" type="number" min="0" step="0.01" value="${esc(k?.budget??'')}" placeholder="Ej. 150">`,f=>{let obj={id:k?.id||id(),name:f.get('name').trim(),age:f.get('age'),emoji:f.get('emoji'),budget:Number(f.get('budget')||0)};if(k)Object.assign(k,obj);else db.kids.push(obj)})}
function openGift(key,kid){window.pendingToyPhoto=undefined;if(!db.kids.length){alert('Primero añade un niño.');tab='ninos';render();openKid();return}let g=db.gifts.find(x=>x.id===key);modal(g?'Editar regalo':'Añadir regalo',`<label>Nombre del regalo *</label><input name="title" required maxlength="100" value="${esc(g?.title||'')}" placeholder="Ej. Bicicleta"><label>Para quién *</label><select name="kid">${db.kids.map(k=>`<option value="${k.id}" ${k.id===(g?.kid||kid)?'selected':''}>${esc(k.name)}</option>`).join('')}</select><div class="split"><div><label>Precio (€)</label><input name="price" type="number" min="0" step="0.01" value="${esc(g?.price??'')}" placeholder="0,00"></div><div><label>Celebración</label><select name="when"><option ${g?.when==='Navidad'?'selected':''}>Navidad</option><option ${g?.when==='Reyes'?'selected':''}>Reyes</option><option ${g?.when==='Cumpleaños'?'selected':''}>Cumpleaños</option></select></div></div><label>Tienda (opcional)</label><input name="shop" maxlength="100" value="${esc(g?.shop||'')}" placeholder="Ej. Juguetería"><label>Imagen del juguete</label><p class="muted">Se crea automáticamente una ilustración. También puedes elegir una foto de tu móvil.</p><img id="toyPreview" class="photo-preview" src="${esc(g?.photo||toyImage(g?.title||'Regalo'))}" alt="Vista previa"><input id="toyUpload" type="file" accept="image/*"><button type="button" class="secondary" id="toyReset">Usar ilustración automática</button><label>Estado</label><select name="status">${['Pendiente','Comprado','Envuelto'].map(s=>`<option ${s===(g?.status||'Pendiente')?'selected':''}>${s}</option>`).join('')}</select>`,f=>{let obj={id:g?.id||id(),title:f.get('title').trim(),kid:f.get('kid'),price:Number(f.get('price')||0),when:f.get('when'),shop:f.get('shop').trim(),status:f.get('status'),photo:window.pendingToyPhoto===undefined?(g?.photo||null):window.pendingToyPhoto};if(g)Object.assign(g,obj);else db.gifts.push(obj)})}
function setStatus(key,s){let g=db.gifts.find(x=>x.id===key);if(g){g.status=s;save()}}function deleteGift(key){if(confirm('¿Eliminar este regalo?')){db.gifts=db.gifts.filter(x=>x.id!==key);save()}}function deleteKid(key){let count=db.gifts.filter(x=>x.kid===key).length;if(confirm(`¿Eliminar este niño y sus ${count} regalos?`)){db.kids=db.kids.filter(x=>x.id!==key);db.gifts=db.gifts.filter(x=>x.kid!==key);save()}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};render();
</script></body></html>
