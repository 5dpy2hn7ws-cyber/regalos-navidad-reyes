<div id="authRoot" class="auth-wrap"><div class="auth-card"><h1>🎄 Mis Regalos Familia</h1><p>Preparando acceso familiar…</p></div></div><div id="appRoot" style="display:none"><header><div style="font-size:29px">🎄 🎁 👑</div><h1>Mis Regalos</h1><p class="intro">Navidad, Reyes y cumpleaños, todo organizado ✨</p></header><main><div class="stats" id="stats"></div><div class="tabs"><button class="active" data-tab="resumen">📊 Resumen</button><button data-tab="ninos">👧 Niños</button><button data-tab="regalos">🎁 Regalos</button></div><section id="view"></section><p class="footer">🔒 Datos familiares sincronizados y protegidos con cuentas personales.</p></main><div id="syncbar" class="syncbar"><span id="syncState">Conectado</span><button class="secondary" onclick="showFamilyDashboard()">Familia</button><button class="secondary" onclick="syncNow()">↻ Actualizar</button><button class="secondary" onclick="logout()">Salir</button></div></div>

<script>
const KEY='mis-regalos-navidad-reyes-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{kids:[],gifts:[]}}catch{db={kids:[],gifts:[]}};db.kids ||= [];db.gifts ||= [];let tab='resumen',filter='Todos',selectedKid=null;const euro=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),save=()=>{render();queueSync()},sum=a=>a.reduce((t,g)=>t+Number(g.price||0),0),orderedKids=()=>[...db.kids].sort((a,b)=>(Number(a.sort_order??9999)-Number(b.sort_order??9999))||a.name.localeCompare(b.name,'es')),name=k=>db.kids.find(x=>x.id===k)?.name||'Sin asignar';

function toyImage(title){const t=String(title||'').toLowerCase();let symbol=/bici|bicicleta|patin/.test(t)?'🚲':/lego|bloque|constru/.test(t)?'🧱':/muñec|barbie|bebé/.test(t)?'🪆':/coche|carro|vehículo/.test(t)?'🚗':/pelota|fútbol|balón/.test(t)?'⚽':/libro|cuento/.test(t)?'📚':/videojuego|consola|playstation|nintendo/.test(t)?'🎮':/peluche|oso/.test(t)?'🧸':/puzzle|rompecabezas/.test(t)?'🧩':/patín|skate/.test(t)?'🛹':'🎁';const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><rect width="240" height="240" rx="28" fill="#e8f3eb"/><circle cx="195" cy="45" r="48" fill="#d1e8d8"/><circle cx="38" cy="202" r="56" fill="#d7e9df"/><text x="120" y="156" font-size="112" text-anchor="middle">${symbol}</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function budgetField(w){return w==='Navidad'?'budget_navidad':w==='Reyes'?'budget_reyes':'budget_cumpleanos'}
function render(){const total=sum(db.gifts),bought=db.gifts.filter(g=>g.status!=='Pendiente'),pending=db.gifts.filter(g=>g.status==='Pendiente');document.getElementById('stats').innerHTML=[["👧 Niños",db.kids.length],["🎁 Regalos",db.gifts.length],["💳 Comprado",euro(sum(bought))],["🛍️ Pendiente",euro(sum(pending))]].map(([a,b])=>`<div class="stat"><small>${a}</small><b>${b}</b></div>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===(tab==='detalleNino'?'ninos':tab)));const v=document.getElementById('view');if(tab==='detalleNino'){const k=db.kids.find(x=>x.id===selectedKid);if(!k){tab='ninos';selectedKid=null;render();return;}const gs=db.gifts.filter(g=>g.kid===k.id),choices=['Navidad','Reyes','Cumpleaños'];const current=typeof occasionFilter==='undefined'?'Todos':occasionFilter;const shown=current==='Todos'?gs:gs.filter(g=>g.when===current);v.innerHTML=`<div class="panel"><button class="secondary" onclick="tab='ninos';selectedKid=null;occasionFilter='Todos';render()">← Volver a niños</button><div class="row" style="margin-top:16px"><div><h2>${esc(k.emoji||'🧒')} ${esc(k.name)}</h2><p class="muted">${gs.length} regalos · ${euro(sum(gs))}</p></div><button onclick="openGift(null,'${k.id}')">+ Regalo</button></div><p class="muted" style="margin-top:14px">Pulsa una celebración para ver sus regalos y presupuesto.</p><div class="occasion-grid">${choices.map(w=>{const list=gs.filter(g=>g.when===w),spent=sum(list),budget=Number(k[budgetField(w)]||0),left=budget-spent;return `<button type="button" class="occasion-card ${current===w?'selected':''}" onclick="occasionFilter='${w}';render()"><span>${w==='Navidad'?'🎄':w==='Reyes'?'👑':'🎂'} ${w}</span><strong>${euro(spent)}</strong><small>${list.length} regalos</small><small>Presupuesto: ${euro(budget)}</small><small>${budget?(left>=0?'Disponible: '+euro(left):'Excedido: '+euro(-left)):'Sin presupuesto asignado'}</small></button>`}).join('')}</div><div class="row" style="margin-top:15px;flex-wrap:wrap"><button class="secondary" onclick="occasionFilter='Todos';render()">${current==='Todos'?'✓ ':''}Todos los regalos</button><button class="secondary" onclick="openKid('${k.id}')">✏️ Editar presupuestos</button></div><h2 style="margin-top:20px">${current==='Todos'?'Todos sus regalos':(current==='Navidad'?'🎄 ':current==='Reyes'?'👑 ':'🎂 ')+current} (${shown.length})</h2>${shown.length?shown.map(g=>giftHtml(g,true)).join(''):'<div class="empty">Todavía no hay regalos en este apartado.</div>'}</div>`;return;}if(tab==='resumen'){v.innerHTML=`<div class="panel"><h2>✨ Resumen general</h2><div class="split"><div class="season season-link" role="button" tabindex="0" onclick="tab='regalos';filter='Navidad';render()" onkeydown="if(event.key==='Enter')this.click()">🎄 Navidad<br><b>${euro(sum(db.gifts.filter(g=>g.when==='Navidad')))}</b><p class="muted">${db.gifts.filter(g=>g.when==='Navidad').length} regalos</p></div><div class="season season-link" role="button" tabindex="0" onclick="tab='regalos';filter='Reyes';render()" onkeydown="if(event.key==='Enter')this.click()">👑 Reyes Magos<br><b>${euro(sum(db.gifts.filter(g=>g.when==='Reyes')))}</b><p class="muted">${db.gifts.filter(g=>g.when==='Reyes').length} regalos</p></div><div class="season season-link" role="button" tabindex="0" onclick="tab='regalos';filter='Cumpleaños';render()" onkeydown="if(event.key==='Enter')this.click()">🎂 Cumpleaños<br><b>${euro(sum(db.gifts.filter(g=>g.when==='Cumpleaños')))}</b><p class="muted">${db.gifts.filter(g=>g.when==='Cumpleaños').length} regalos</p></div></div><p style="margin-top:15px"><b>Valor total previsto: ${euro(total)}</b></p><p class="muted">Incluye regalos comprados y pendientes</p></div><div class="panel"><div class="row"><h2>Por niño</h2><button onclick="openKid()">+ Niño</button></div>${db.kids.length?orderedKids().map(k=>kidHtml(k)).join(''):'<div class="empty"><span>🧸</span>Añade un niño para empezar a organizar sus regalos.<p><button onclick="openKid()">+ Añadir primer niño</button></p></div>'}</div><div class="panel"><div class="row"><h2>Regalos recientes</h2><button onclick="openGift()">+ Regalo</button></div>${db.gifts.length?db.gifts.slice(-4).reverse().map(g=>giftHtml(g)).join(''):'<div class="empty">Todavía no hay regalos añadidos.</div>'}</div>`}if(tab==='ninos')v.innerHTML=`<div class="panel"><div class="row"><h2>Mis niños (${db.kids.length})</h2><button onclick="openKid()">+ Añadir</button></div>${db.kids.length?orderedKids().map((k,i)=>kidHtml(k,true,i)).join(''):'<div class="empty"><span>👧</span>Añade a los niños y fija su presupuesto.</div>'}</div>`;if(tab==='regalos'){let gs=db.gifts.filter(g=>filter==='Todos'||g.when===filter||g.status===filter);v.innerHTML=`<div class="panel"><div class="row"><h2>Lista de regalos</h2><button onclick="openGift()">+ Añadir</button></div><div class="filter">${['Todos','Navidad','Reyes','Cumpleaños','Pendiente','Comprado','Envuelto'].map(f=>`<button class="${filter===f?'':'secondary'}" onclick="filter=${JSON.stringify(f)};render()">${f}</button>`).join('')}</div>${gs.length?gs.map(g=>giftHtml(g,true)).join(''):'<div class="empty"><span>🎁</span>No hay regalos en esta categoría.</div>'}</div>`}}
function kidHtml(k,edit=false,index=0){let gifts=db.gifts.filter(g=>g.kid===k.id),spent=sum(gifts),budget=Number(k.budget_navidad||0)+Number(k.budget_reyes||0)+Number(k.budget_cumpleanos||0),pct=budget?Math.min(100,spent/budget*100):0;return `<div class="kid"><div class="row"><div class="avatar">${esc(k.emoji||'🧒')}</div><div class="grow"><strong>${esc(k.name)}</strong><div class="muted">${k.age!==''&&k.age!=null?esc(k.age)+' años · ':''}${gifts.length} regalos</div></div><strong>${euro(spent)}</strong></div>${budget?`<div class="progress ${spent>budget?'over':''}"><div style="width:${pct}%"></div></div><div class="row mini muted"><span>Presupuesto: ${euro(budget)}</span><span>${spent>budget?'Excedido '+euro(spent-budget):'Disponible '+euro(budget-spent)}</span></div>`:'<p class="muted">🎄 ${euro(k.budget_navidad||0)} · 👑 ${euro(k.budget_reyes||0)} · 🎂 ${euro(k.budget_cumpleanos||0)} de presupuesto</p>'}<div class="gift-actions"><button onclick="selectedKid='${k.id}';occasionFilter='Todos';tab='detalleNino';render()">🎁 Ver todos sus regalos</button><button class="secondary" onclick="openGift(null,'${k.id}')">+ Regalo</button>${edit?`<button class="secondary" onclick="moveKid('${k.id}',-1)" ${index===0?'disabled':''} aria-label="Subir ${esc(k.name)}">↑ Subir</button><button class="secondary" onclick="moveKid('${k.id}',1)" ${index===db.kids.length-1?'disabled':''} aria-label="Bajar ${esc(k.name)}">↓ Bajar</button><button class="secondary" onclick="openKid('${k.id}')">Editar</button><button class="danger" onclick="deleteKid('${k.id}')">Eliminar</button>`:''}</div></div>`}
function moveKid(key,direction){const list=orderedKids(),i=list.findIndex(k=>k.id===key),j=i+direction;if(i<0||j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];list.forEach((k,n)=>{const target=db.kids.find(x=>x.id===k.id);target.sort_order=n});save()}
function giftHtml(g,edit=false){return `<div class="gift"><div class="row"><img class="toy-photo" src="${esc(g.photo||toyImage(g.title))}" alt="Imagen del regalo"><div class="grow"><strong>${esc(g.title)}</strong><p class="muted">${esc(name(g.kid))} · ${g.when==='Navidad'?'🎄 Navidad':g.when==='Cumpleaños'?'🎂 Cumpleaños':'👑 Reyes'}${g.shop?' · '+esc(g.shop):''}</p><span class="tag">${g.status==='Pendiente'?'📝':g.status==='Comprado'?'🛍️':'🎀'} ${esc(g.status)}</span></div><strong>${euro(g.price)}</strong></div><div class="gift-actions">${g.status==='Pendiente'?`<button class="secondary" onclick="setStatus('${g.id}','Comprado')">✓ Comprado</button>`:g.status==='Comprado'?`<button class="secondary" onclick="setStatus('${g.id}','Envuelto')">🎀 Envuelto</button>`:''}<button class="secondary" onclick="openGift('${g.id}')">Editar</button>${edit?`<button class="danger" onclick="deleteGift('${g.id}')">Eliminar</button>`:''}</div></div>`}
function modal(title,html,submit){document.getElementById('modalTitle').textContent=title;let f=document.getElementById('form');f.innerHTML=html+'<div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button type="submit">Guardar ✓</button></div>';f.onsubmit=e=>{e.preventDefault();submit(new FormData(f));closeModal();save()};document.getElementById('overlay').classList.add('show');if(document.getElementById('toyUpload')){const upload=document.getElementById('toyUpload'),preview=document.getElementById('toyPreview'),titleInput=f.querySelector('[name=title]');titleInput.addEventListener('input',()=>{if(!window.pendingToyPhoto)preview.src=toyImage(titleInput.value)});upload.addEventListener('change',async()=>{let file=upload.files?.[0];if(!file)return;if(file.size>12000000){alert('Elige una imagen de menos de 12 MB');return}try{const bitmap=await createImageBitmap(file),canvas=document.createElement('canvas'),scale=Math.min(1,650/Math.max(bitmap.width,bitmap.height));canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);window.pendingToyPhoto=canvas.toDataURL('image/jpeg',.72);preview.src=window.pendingToyPhoto;bitmap.close()}catch(e){alert('No se ha podido leer la foto')}});document.getElementById('toyReset').onclick=()=>{window.pendingToyPhoto=null;preview.src=toyImage(titleInput.value);upload.value=''}}};function closeModal(){document.getElementById('overlay').classList.remove('show')}
function openKid(key){let k=db.kids.find(x=>x.id===key);modal(k?'Editar niño':'Añadir niño',`<label>Nombre *</label><input name="name" maxlength="60" required value="${esc(k?.name||'')}" placeholder="Ej. Lucía"><div class="split"><div><label>Edad</label><input name="age" type="number" min="0" max="99" value="${esc(k?.age??'')}" placeholder="Años"></div><div><label>Icono</label><select name="emoji">${['🧒','👧','👦','👶','💖','⭐'].map(e=>`<option ${e===(k?.emoji||'🧒')?'selected':''}>${e}</option>`).join('')}</select></div></div><p class="muted" style="margin-top:14px">Presupuesto independiente para cada celebración:</p>${[['Navidad','budget_navidad'],['Reyes Magos','budget_reyes'],['Cumpleaños','budget_cumpleanos']].map(([title,field])=>`<label>${title} (€)</label><input name="${field}" type="number" min="0" step="0.01" value="${esc(k?.[field]??0)}" placeholder="0,00">`).join('')}`,f=>{let obj={id:k?.id||id(),name:f.get('name').trim(),age:f.get('age'),emoji:f.get('emoji'),budget:Number(f.get('budget_navidad')||0)+Number(f.get('budget_reyes')||0)+Number(f.get('budget_cumpleanos')||0),budget_navidad:Number(f.get('budget_navidad')||0),budget_reyes:Number(f.get('budget_reyes')||0),budget_cumpleanos:Number(f.get('budget_cumpleanos')||0),sort_order:k?.sort_order??db.kids.length};if(k)Object.assign(k,obj);else db.kids.push(obj)})}
function openGift(key,kid){window.pendingToyPhoto=undefined;if(!db.kids.length){alert('Primero añade un niño.');tab='ninos';render();openKid();return}let g=db.gifts.find(x=>x.id===key);modal(g?'Editar regalo':'Añadir regalo',`<label>Nombre del regalo *</label><input name="title" required maxlength="100" value="${esc(g?.title||'')}" placeholder="Ej. Bicicleta"><label>Para quién *</label><select name="kid">${db.kids.map(k=>`<option value="${k.id}" ${k.id===(g?.kid||kid)?'selected':''}>${esc(k.name)}</option>`).join('')}</select><div class="split"><div><label>Precio (€)</label><input name="price" type="number" min="0" step="0.01" value="${esc(g?.price??'')}" placeholder="0,00"></div><div><label>Celebración</label><select name="when"><option ${g?.when==='Navidad'?'selected':''}>Navidad</option><option ${g?.when==='Reyes'?'selected':''}>Reyes</option><option ${g?.when==='Cumpleaños'?'selected':''}>Cumpleaños</option></select></div></div><label>Tienda (opcional)</label><input name="shop" maxlength="100" value="${esc(g?.shop||'')}" placeholder="Ej. Juguetería"><label>Imagen del juguete</label><p class="muted">Se crea automáticamente una ilustración. También puedes elegir una foto de tu móvil.</p><img id="toyPreview" class="photo-preview" src="${esc(g?.photo||toyImage(g?.title||'Regalo'))}" alt="Vista previa"><input id="toyUpload" type="file" accept="image/*"><button type="button" class="secondary" id="toyReset">Usar ilustración automática</button><label>Estado</label><select name="status">${['Pendiente','Comprado','Envuelto'].map(s=>`<option ${s===(g?.status||'Pendiente')?'selected':''}>${s}</option>`).join('')}</select>`,f=>{let obj={id:g?.id||id(),title:f.get('title').trim(),kid:f.get('kid'),price:Number(f.get('price')||0),when:f.get('when'),shop:f.get('shop').trim(),status:f.get('status'),photo:window.pendingToyPhoto===undefined?(g?.photo||null):window.pendingToyPhoto};if(g)Object.assign(g,obj);else db.gifts.push(obj)})}
function setStatus(key,s){let g=db.gifts.find(x=>x.id===key);if(g){g.status=s;save()}}function deleteGift(key){if(confirm('¿Eliminar este regalo?')){db.gifts=db.gifts.filter(x=>x.id!==key);save()}}function deleteKid(key){let count=db.gifts.filter(x=>x.kid===key).length;if(confirm(`¿Eliminar este niño y sus ${count} regalos?`)){db.kids=db.kids.filter(x=>x.id!==key);db.gifts=db.gifts.filter(x=>x.kid!==key);save()}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};boot();

const SUPA_URL='https://nqdlshhoadgndafsfatr.supabase.co';
const SUPA_PUBLIC_KEY='sb_publishable_KYICyu4bKh_s7j_SsrlSRA_kZoCQo-s';
let client=null,currentUser=null,family=null,lastSnapshot={kids:[],gifts:[]},syncPending=false,syncRunning=false,syncTimer=null,isReady=false,working=false,refreshTimer=null;
const ar=document.getElementById('authRoot'),app=document.getElementById('appRoot');
const message=(txt,error=false)=>{let e=document.getElementById('authMessage');if(e){e.className='auth-msg'+(error?' auth-error':'');e.textContent=txt;}};
const showAuth=(html)=>{app.style.display='none';ar.style.display='flex';ar.innerHTML='<div class="auth-card">'+html+'<div id="authMessage" aria-live="polite" style="margin-top:12px"></div></div>';};
const errText=e=>e?.message||String(e);
function renderLogin(mode='login'){
 const isJoin=mode==='register';
 showAuth(`<h1>🎄 Mis Regalos Familia</h1><p class="muted">Dos cuentas diferentes, una lista de regalos compartida.</p><div class="switcher"><button class="${!isJoin?'':'secondary'}" onclick="renderLogin('login')">Entrar</button><button class="${isJoin?'':'secondary'}" onclick="renderLogin('register')">Crear cuenta</button></div><form id="loginForm"><label>Correo electrónico</label><input name="email" type="email" autocomplete="email" required placeholder="tu@email.com"><label>Contraseña</label><input name="password" type="password" minlength="6" autocomplete="${isJoin?'new-password':'current-password'}" required><button type="submit" style="width:100%">${isJoin?'Crear cuenta':'Entrar a mis regalos'}</button></form><p style="margin-top:14px"><button class="secondary" onclick="resetPassword()">He olvidado la contraseña</button></p><p class="muted">Tus datos se guardarán de forma privada. No compartáis contraseñas.</p>`);
 document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),email=f.get('email').trim(),password=f.get('password');message('Conectando…');try{let r=isJoin?await client.auth.signUp({email,password,options:{emailRedirectTo:location.origin}}):await client.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(isJoin&&!r.data.session){message('Cuenta creada. Revisa tu correo y confirma el enlace. Después vuelve aquí para entrar.');return;}await bootLogged();}catch(ex){message(errText(ex),true)}};
}
async function resetPassword(){const email=prompt('Escribe el correo de tu cuenta');if(!email)return;const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin});message(error?errText(error):'Revisa el correo. El enlace para recuperar tu contraseña llegará allí.',!!error)}
function showChooseFamily(){showAuth(`<h1>👨‍👩‍👧 Familia compartida</h1><p class="muted">Sesión: <b>${esc(currentUser.email||'')}</b></p><div class="panel"><h2>Crear mi familia</h2><p class="muted">Hazlo solo una vez, desde el primer móvil. Después comparte el código con tu pareja.</p><form id="newFamily"><label>Nombre familiar</label><input name="name" required value="Nuestra familia" maxlength="60"><button type="submit">Crear familia</button></form></div><div class="panel"><h2>Unirme a una familia</h2><p class="muted">En el segundo móvil, escribe el código que aparece en el primero.</p><form id="joinFamily"><label>Código de invitación</label><input name="code" required autocomplete="off" placeholder="Pega aquí el código" maxlength="100"><button type="submit">Unirme</button></form></div><button class="secondary" onclick="logout()">Cerrar sesión</button>`);
 document.getElementById('newFamily').onsubmit=async e=>{e.preventDefault();message('Creando familia…');const name=new FormData(e.target).get('name').trim();const {error}=await client.rpc('create_family',{n:name});if(error){message(errText(error),true);return;}await bootLogged();};
 document.getElementById('joinFamily').onsubmit=async e=>{e.preventDefault();message('Comprobando código…');const code=new FormData(e.target).get('code').trim();const {error}=await client.rpc('join_family',{code});if(error){message(errText(error),true);return;}await bootLogged();};
}
function showFamilyDashboard(){showAuth(`<h1>🎁 ${esc(family.name)}</h1><p class="muted">Conectado: <b>${esc(currentUser.email||'')}</b></p><h2>🔗 Invitar a tu pareja</h2><p class="muted">Tu pareja debe registrarse con su propio correo y pulsar «Unirme a una familia».</p><div class="copy-code" id="invCode">${esc(family.invite_code)}</div><button onclick="navigator.clipboard.writeText(document.getElementById('invCode').textContent).then(()=>message('Código copiado')).catch(()=>message('Mantén pulsado el código para copiarlo'))">Copiar código de invitación</button><button class="secondary" onclick="enterApp()">Continuar a mis regalos</button><button class="secondary" onclick="importOriginalFromButton()">Importar regalos antiguos</button><button class="secondary" onclick="logout()">Salir</button><p class="muted">Comparte el código solo con tu pareja. Cualquiera con el código y una cuenta confirmada podría solicitar unirse a esta familia.</p>`)}
async function boot(){if(!window.supabase?.createClient){showAuth('<h1>No se pudo cargar la conexión</h1><p>Comprueba que tienes Internet y vuelve a abrir la aplicación.</p><button onclick="location.reload()">Reintentar</button>');return;}
 client=window.supabase.createClient(SUPA_URL,SUPA_PUBLIC_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data,error}=await client.auth.getUser();if(error&&!/session missing/i.test(error.message)){console.warn('Auth:',error.message)}currentUser=data?.user||null;if(currentUser)await bootLogged();else renderLogin();
 client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){currentUser=null;family=null;isReady=false;clearInterval(refreshTimer);renderLogin();}else if(event==='PASSWORD_RECOVERY'){showAuth('<h1>Recuperar contraseña</h1><form id="changePass"><label>Nueva contraseña</label><input type="password" name="p" minlength="6" required><button type="submit">Cambiar contraseña</button></form>');document.getElementById('changePass').onsubmit=async e=>{e.preventDefault();let {error}=await client.auth.updateUser({password:new FormData(e.target).get('p')});message(error?errText(error):'Contraseña actualizada. Ya puedes entrar.',!!error)}}});
}
async function bootLogged(){const r=await client.auth.getUser();if(!r.data?.user){renderLogin();return;}currentUser=r.data.user;
 try{let {data,error}=await client.from('family_members').select('family_id').eq('user_id',currentUser.id);if(error)throw error;
 if(!data?.length){family=null;showChooseFamily();return;}
 const f=await client.from('families').select('id,name,invite_code').eq('id',data[0].family_id).single();if(f.error)throw f.error;family=f.data;showFamilyDashboard();}catch(e){showAuth('<h1>No se puede leer la familia</h1><p class="muted">Comprueba que las tablas y permisos SQL están configurados correctamente.</p><button onclick="bootLogged()">Reintentar</button><button class="secondary" onclick="logout()">Salir</button>');message(errText(e),true)}}
async function enterApp(){if(!family)return;showAuth('<h1>Cargando regalos…</h1>');try{await fetchCloud();ar.style.display='none';app.style.display='block';isReady=true;render();setSyncState('✓ Regalos sincronizados');clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(isReady&&!syncRunning&&!syncPending&&document.visibilityState==='visible')fetchCloud().then(()=>render()).catch(e=>setSyncState('Sin conexión: '+errText(e)))},12000);
 const local=JSON.parse(localStorage.getItem(KEY)||'{"kids":[],"gifts":[]}');if((local.kids?.length||0)+(local.gifts?.length||0)>0 && !sessionStorage.getItem('migrationPrompted')){sessionStorage.setItem('migrationPrompted','1');setTimeout(()=>{if(confirm('Hemos encontrado regalos guardados en este móvil. ¿Quieres importar una copia a la familia compartida? No se borrará tu copia local.'))importLocal(local)},350)}
 }catch(e){showAuth('<h1>Error al cargar</h1><button onclick="enterApp()">Reintentar</button>');message(errText(e),true)}}
function setSyncState(text){const el=document.getElementById('syncState');if(el)el.textContent=text}
function fromRows(kr,gr){return {kids:kr.map(k=>({id:k.id,name:k.name,age:k.age??'',emoji:k.emoji||'🧒',budget:Number(k.budget||0),budget_navidad:Number(k.budget_navidad||0),budget_reyes:Number(k.budget_reyes||0),budget_cumpleanos:Number(k.budget_cumpleanos||0),sort_order:Number(k.sort_order??9999)})),gifts:gr.map(g=>({id:g.id,title:g.name,kid:g.kid_id,price:Number(g.price||0),when:g.occasion,status:g.status,shop:g.store||'',photo:g.image_path||null}))}}
// La primera versión de la base no incluye columna emoji: conservamos iconos en el móvil si existen.
async function fetchCloud(){if(!family||syncRunning||syncPending)return;const [kr,gr]=await Promise.all([client.from('kids').select('*').eq('family_id',family.id),client.from('gifts').select('*').eq('family_id',family.id)]);if(kr.error)throw kr.error;if(gr.error)throw gr.error;const oldIcons=new Map(db.kids.map(k=>[k.id,k.emoji]));const next=fromRows(kr.data||[],gr.data||[]);next.kids.forEach(k=>k.emoji=oldIcons.get(k.id)||k.emoji);db=next;lastSnapshot=structuredClone(db);if(isReady)render()}
function queueSync(){if(!isReady)return;syncPending=true;setSyncState('⟳ Guardando cambios…');clearTimeout(syncTimer);syncTimer=setTimeout(flushSync,250)}
async function flushSync(){if(syncRunning||!syncPending||!family)return;syncRunning=true;syncPending=false;const before=structuredClone(lastSnapshot),next=structuredClone(db);try{
 const oldK=new Map(before.kids.map(x=>[x.id,x])),newK=new Map(next.kids.map(x=>[x.id,x]));const oldG=new Map(before.gifts.map(x=>[x.id,x])),newG=new Map(next.gifts.map(x=>[x.id,x]));
 const kids=next.kids.filter(k=>JSON.stringify(k)!==JSON.stringify(oldK.get(k.id))).map(k=>({id:k.id,family_id:family.id,name:k.name,age:k.age===''?null:Number(k.age),budget:Number(k.budget||0),budget_navidad:Number(k.budget_navidad||0),budget_reyes:Number(k.budget_reyes||0),budget_cumpleanos:Number(k.budget_cumpleanos||0),sort_order:Number(k.sort_order??9999)}));
 if(kids.length){const r=await client.from('kids').upsert(kids);if(r.error)throw r.error;}
 const gifts=next.gifts.filter(g=>JSON.stringify(g)!==JSON.stringify(oldG.get(g.id))).map(g=>({id:g.id,family_id:family.id,kid_id:g.kid,name:g.title,price:Number(g.price||0),store:g.shop||null,occasion:g.when,status:g.status,image_path:g.photo||null,created_by:currentUser.id}));
 if(gifts.length){const r=await client.from('gifts').upsert(gifts);if(r.error)throw r.error;}
 const removedG=before.gifts.filter(g=>!newG.has(g.id)).map(g=>g.id);if(removedG.length){const r=await client.from('gifts').delete().in('id',removedG).eq('family_id',family.id);if(r.error)throw r.error;}
 const removedK=before.kids.filter(k=>!newK.has(k.id)).map(k=>k.id);if(removedK.length){const r=await client.from('kids').delete().in('id',removedK).eq('family_id',family.id);if(r.error)throw r.error;}
 lastSnapshot=next;setSyncState('✓ Guardado en la familia');
 }catch(e){setSyncState('⚠ No se pudo guardar: '+errText(e));alert('No se han guardado todos los cambios en Supabase: '+errText(e)+'\nNo cierres la aplicación hasta reintentar.');syncPending=true;}finally{syncRunning=false;if(syncPending){clearTimeout(syncTimer);syncTimer=setTimeout(flushSync,1800)}}}
async function syncNow(){if(syncPending||syncRunning){await flushSync();return;}try{await fetchCloud();setSyncState('✓ Actualizado');}catch(e){setSyncState('⚠ '+errText(e))}}
async function importLocal(local){if(!family)return;let old=db;try{let knownK=new Set(old.kids.map(k=>k.id)),knownG=new Set(old.gifts.map(g=>g.id));const importedKids=(local.kids||[]).filter(k=>!knownK.has(k.id));const importedGifts=(local.gifts||[]).filter(g=>!knownG.has(g.id));db={kids:[...old.kids,...importedKids],gifts:[...old.gifts,...importedGifts]};render();queueSync();alert('Importación preparada: '+importedKids.length+' niños y '+importedGifts.length+' regalos. Se está guardando en la familia.');}catch(e){db=old;alert('No se pudo importar: '+errText(e))}}
async function importOriginalFromButton(){let local;try{local=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{local={}};if(!local.kids?.length&&!local.gifts?.length){message('No hay regalos antiguos guardados en este navegador.');return;}if(!confirm('¿Importar '+(local.kids?.length||0)+' niños y '+(local.gifts?.length||0)+' regalos antiguos a la familia?'))return;await fetchCloud();isReady=true;importLocal(local);ar.style.display='none';app.style.display='block';}
async function logout(){if(syncPending||syncRunning){alert('Hay cambios pendientes de guardar. Espera a que aparezca «Guardado» antes de salir.');return;}clearInterval(refreshTimer);if(client)await client.auth.signOut();currentUser=null;family=null;isReady=false;renderLogin()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&isReady&&!syncRunning&&!syncPending)syncNow()});
boot();
